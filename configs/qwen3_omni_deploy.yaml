name: qwen3-omni-native-realtime
platform: vast_ai
runtime:
  model: /workspace/omni/models/Qwen3-Omni-30B-A3B-Instruct
  hf_hub_disable_xet: true
  qwen_realtime_url: ws://127.0.0.1:17091/v1/realtime
  qwen_health_url: http://127.0.0.1:17091/health
services:
  qwen:
    port: 17091
    command: >
      /workspace/omni/scripts/run_qwen_model.sh
  gateway:
    port: 17080
    command: >
      /workspace/omni/scripts/run_gateway_dev.sh
    env:
      QWEN_REALTIME_URL: ws://127.0.0.1:17091/v1/realtime
      QWEN_HEALTH_URL: http://127.0.0.1:17091/health
  worker:
    command: >
      /workspace/omni/scripts/run_worker_dev.sh
  web:
    port: 17070
    command: >
      /workspace/omni/scripts/run_web_dev.sh
    env:
      VITE_GATEWAY_HTTP_URL: ""
external_access:
  web: https://$PUBLIC_IPADDR:$VAST_TCP_PORT_3000/?token=$OPEN_BUTTON_TOKEN
  gateway_ready: https://$PUBLIC_IPADDR:$VAST_TCP_PORT_8080/ready?token=$OPEN_BUTTON_TOKEN
  qwen_health: https://$PUBLIC_IPADDR:$VAST_TCP_PORT_8091/health?token=$OPEN_BUTTON_TOKEN
