[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-omni-gateway"
version = "0.1.0"
description = "Gateway for Qwen3-Omni native realtime browser sessions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "livekit==1.1.8",
  "livekit-agents[silero]>=1.5.17,<2.0.0",
  "livekit-api>=1.1.0,<2.0.0",
  "numpy>=2.0.0,<3.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "websockets>=12.0,<15.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.7,<1.0.0"
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
