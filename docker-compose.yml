services:
  qwen3-omni:
    build:
      context: .
      dockerfile: configs/qwen3-omni.Dockerfile
    container_name: qwen3-omni
    environment:
      QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3-Omni-30B-A3B-Instruct}
      QWEN_DEPLOY_CONFIG: ${QWEN_DEPLOY_CONFIG:-/workspace/configs/qwen3_omni_single_a100.yaml}
      QWEN_PORT: ${QWEN_PORT:-8091}
      QWEN_VLLM_FLAGS: ${QWEN_VLLM_FLAGS:-}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /workspace/.cache/huggingface
      TRANSFORMERS_CACHE: /workspace/.cache/huggingface
      VLLM_USE_V1: "0"
    command: >
      bash -lc "vllm serve ${QWEN_MODEL:-Qwen/Qwen3-Omni-30B-A3B-Instruct}
      --omni
      --deploy-config ${QWEN_DEPLOY_CONFIG:-/workspace/configs/qwen3_omni_single_a100.yaml}
      --host 0.0.0.0
      --port ${QWEN_PORT:-8091}
      --trust-remote-code
      ${QWEN_VLLM_FLAGS:-}"
    ports:
      - "${QWEN_PORT:-8091}:${QWEN_PORT:-8091}"
    volumes:
      - qwen-cache:/workspace/.cache
      - ./models:/workspace/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${QWEN_PORT:-8091}/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: qwen3-omni-gateway
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      QWEN_REALTIME_URL: ${QWEN_REALTIME_URL:-ws://qwen3-omni:8091/v1/realtime}
      QWEN_CHAT_URL: ${QWEN_CHAT_URL:-http://qwen3-omni:8091/v1/chat/completions}
      QWEN_HEALTH_URL: ${QWEN_HEALTH_URL:-http://qwen3-omni:8091/health}
      QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3-Omni-30B-A3B-Instruct}
      QWEN_TEXT_MAX_COMPLETION_TOKENS: ${QWEN_TEXT_MAX_COMPLETION_TOKENS:-64}
      QWEN_DEBUG_RAW_EVENTS: ${QWEN_DEBUG_RAW_EVENTS:-false}
      QWEN_REQUEST_TIMEOUT_SECONDS: ${QWEN_REQUEST_TIMEOUT_SECONDS:-30}
      QWEN_RESPONSE_TIMEOUT_SECONDS: ${QWEN_RESPONSE_TIMEOUT_SECONDS:-90}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_ROOM: ${LIVEKIT_ROOM:-omni-room}
      LIVEKIT_AGENT_ID: ${LIVEKIT_AGENT_ID:-omni-worker}
      LIVEKIT_BROWSER_IDENTITY_PREFIX: ${LIVEKIT_BROWSER_IDENTITY_PREFIX:-browser}
      LIVEKIT_CONTROL_TOPIC: ${LIVEKIT_CONTROL_TOPIC:-omni.control}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-3600}
      LIVEKIT_INPUT_SAMPLE_RATE: ${LIVEKIT_INPUT_SAMPLE_RATE:-16000}
      LIVEKIT_OUTPUT_SAMPLE_RATE: ${LIVEKIT_OUTPUT_SAMPLE_RATE:-48000}
      LIVEKIT_OUTPUT_FRAME_MS: ${LIVEKIT_OUTPUT_FRAME_MS:-20}
      LIVEKIT_OUTPUT_QUEUE_MS: ${LIVEKIT_OUTPUT_QUEUE_MS:-60}
      LIVEKIT_PREROLL_FRAMES: ${LIVEKIT_PREROLL_FRAMES:-8}
    depends_on:
      qwen3-omni:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: qwen3-omni-worker
    environment:
      QWEN_REALTIME_URL: ${QWEN_REALTIME_URL:-ws://qwen3-omni:8091/v1/realtime}
      QWEN_CHAT_URL: ${QWEN_CHAT_URL:-http://qwen3-omni:8091/v1/chat/completions}
      QWEN_HEALTH_URL: ${QWEN_HEALTH_URL:-http://qwen3-omni:8091/health}
      QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3-Omni-30B-A3B-Instruct}
      QWEN_TEXT_MAX_COMPLETION_TOKENS: ${QWEN_TEXT_MAX_COMPLETION_TOKENS:-64}
      QWEN_DEBUG_RAW_EVENTS: ${QWEN_DEBUG_RAW_EVENTS:-false}
      QWEN_REQUEST_TIMEOUT_SECONDS: ${QWEN_REQUEST_TIMEOUT_SECONDS:-30}
      QWEN_RESPONSE_TIMEOUT_SECONDS: ${QWEN_RESPONSE_TIMEOUT_SECONDS:-90}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_ROOM: ${LIVEKIT_ROOM:-omni-room}
      LIVEKIT_AGENT_ID: ${LIVEKIT_AGENT_ID:-omni-worker}
      LIVEKIT_BROWSER_IDENTITY_PREFIX: ${LIVEKIT_BROWSER_IDENTITY_PREFIX:-browser}
      LIVEKIT_CONTROL_TOPIC: ${LIVEKIT_CONTROL_TOPIC:-omni.control}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-3600}
      LIVEKIT_INPUT_SAMPLE_RATE: ${LIVEKIT_INPUT_SAMPLE_RATE:-16000}
      LIVEKIT_OUTPUT_SAMPLE_RATE: ${LIVEKIT_OUTPUT_SAMPLE_RATE:-48000}
      LIVEKIT_OUTPUT_FRAME_MS: ${LIVEKIT_OUTPUT_FRAME_MS:-20}
      LIVEKIT_OUTPUT_QUEUE_MS: ${LIVEKIT_OUTPUT_QUEUE_MS:-60}
      LIVEKIT_PREROLL_FRAMES: ${LIVEKIT_PREROLL_FRAMES:-8}
    depends_on:
      qwen3-omni:
        condition: service_healthy
    command: python -m src.livekit.worker
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: qwen3-omni-web
    environment:
      VITE_GATEWAY_HTTP_URL: ${VITE_GATEWAY_HTTP_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      WEB_PORT: ${WEB_PORT:-3000}
    depends_on:
      gateway:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0 --port ${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    restart: unless-stopped

volumes:
  qwen-cache:
