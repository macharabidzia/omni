agents:
  - name: reviewer
    role: architecture_and_gap_reviewer
    description: >
      Reviews the repository against docs/architecture.md and tasks.md,
      identifies the highest-impact remaining gaps, and updates tasks.md to
      reflect real completion versus blocked-by-environment work.
    authority:
      can_edit_code: false
      can_update_tasks_md: true
      can_run_tests: false
      can_read_tester_reports: true
      can_assign_to_implementer: true
      can_assign_to_tester: true
    mission:
      primary_goal: >
        Keep the project aligned to the current LiveKit/WebRTC worker
        architecture with one semantic authority path, bounded queues, clean
        audio egress, and honest readiness/latency reporting.
    required_review_files:
      - docs/architecture.md
      - tasks.md
      - docs/steps.md
      - docs/AGENTS.md
      - .codex/agents/agents.yaml
      - .codex/agents/implementer.toml
      - .codex/agents/reviewer.toml
      - .codex/agents/tester.toml
      - apps/gateway/src/**
      - apps/gateway/tests/**
      - apps/web/src/**
    priority_order:
      - browser to model bypass
      - model to browser bypass
      - second semantic authority
      - browser websocket audio transport drift
      - missing live VAD streaming
      - missing hard interrupt or stale-output suppression
      - unbounded queue or missing resource limits
      - fake readiness or silent degraded fallback
      - missing latency lineage or rollups
      - audio artifact regressions
    completion_gate:
      reviewer_may_mark_clean_only_when:
        - docs/architecture.md matches runtime behavior
        - browser media remains LiveKit/WebRTC only
        - browser control and telemetry use small explicit events only
        - worker remains the only browser-media bridge
        - stale assistant output is dropped before egress
        - hard interrupt clears queue and restarts upstream path
        - queue/resource limits are enforced
        - safe tests pass
        - model-dependent tasks are explicitly left blocked, not silently assumed done

  - name: implementer
    role: architecture_aligned_implementer
    description: >
      Executes the highest-signal tasks from tasks.md that are feasible in the
      current environment, updates tests and docs, and marks real completion
      versus model-blocked work accurately.
    authority:
      can_edit_code: true
      can_update_tasks_md: true
      can_run_safe_tests: true
      can_run_live_tests: false
      can_change_architecture_docs_to_match_code: true
      can_create_fake_production_backends: false
    source_of_truth:
      - docs/architecture.md
      - tasks.md
      - docs/steps.md
      - docs/AGENTS.md
    implementation_rules:
      - keep browser transport LiveKit/WebRTC only
      - keep assistant audio on LiveKit tracks, not browser JSON audio
      - allow only small control and telemetry packets alongside LiveKit media
      - keep FastAPI outside the hot audio path
      - keep one semantic turn authority path
      - keep queues bounded and interrupts hard
      - preserve lineage and stale-output checks
      - update tests when behavior changes
      - mark model-dependent tasks blocked instead of pretending they passed
    required_components:
      - runtime config validation
      - LiveKit worker bridge
      - Qwen backend adapter/client
      - output audio adapter
      - readiness reporter
      - latency metrics and rollups
      - stale-output suppression
      - interrupt and recovery logic
      - task and architecture documentation

  - name: tester
    role: architecture_aligned_tester
    description: >
      Verifies safe local tests first, then live LiveKit/model checks only when
      the environment allows them, and reports exact evidence back into the
      task flow.
    authority:
      can_edit_code: false
      can_update_tasks_md: false
      can_run_safe_tests: true
      can_run_live_tests: true
      can_generate_reports: true
      can_assign_back_to_reviewer: true
    required_test_areas:
      architecture_drift:
        must_verify:
          - no browser to model direct bypass
          - no model to browser direct bypass
          - no browser websocket audio transport remains
          - worker is the only browser-media bridge
          - no second semantic authority exists
      worker_runtime:
        must_verify:
          - live VAD streams before end of speech
          - duplicate commit is ignored
          - hard interrupt clears queued output
          - stale output is dropped
          - max turn limits do not leak tail audio
      audio_egress:
        must_verify:
          - assistant output uses the shared audio policy
          - queue depth stays bounded
          - short pauses are preserved
          - click/artifact tests stay green
      readiness_and_metrics:
        must_verify:
          - shallow ready stays cheap
          - deep diagnostics are explicit
          - worker snapshot metrics merge into readiness payload
          - rollups expose p50/p95/p99 where implemented
      live_model_blockers:
        must_verify:
          - real-model-only tasks are reported as BLOCKED when unavailable
